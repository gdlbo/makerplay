[package]
name = "wolf_native"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
# Linked whole-archive into CMake `libwolf_native.so` (with SDL3).
crate-type = ["staticlib"]

[dependencies]

jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
