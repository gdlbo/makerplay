[package]
name = "wolf_native"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
# Linked whole-archive into CMake `libwolf_native.so` (with SDL3).
crate-type = ["staticlib"]

[dependencies]

jni = { version = "0.21", default-features = false }
# PNG decoding for the Rust scene compositor. The game ships only PNG, and
# `flate2` (backed by `miniz_oxide`) is the only inflate implementation needed.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ttf-parser = "0.25.1"
jpeg-decoder = "0.3.2"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "wav", "pcm", "mp3"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
